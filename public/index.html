<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100d19">
  <meta name="description" content="Create your own knockout rankings and settle debates with your friends in real time.">
  <title>Duel Club — The group decides.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <div class="site-shell">
    <header class="topbar">
      <a href="/" class="brand" data-link aria-label="Duel Club home"><span class="brand-mark">✳</span><span>duel<span class="brand-accent">club</span><span class="brand-dot">.</span></span></a>
      <nav class="header-links" aria-label="Main navigation">
        <a href="/" data-link id="discover-link">Explore packs</a>
        <a href="/create" data-link id="create-link">Create a pack</a>
      </nav>
      <div class="header-right">
        <button class="name-chip" id="name-chip" type="button" title="Set your nickname"><span class="name-orb">✦</span><span id="name-chip-text">Your name</span></button>
        <button class="button button-primary button-small" id="join-top" type="button">Join a room <span>↗</span></button>
      </div>
    </header>
    <main id="app" aria-live="polite"></main>
    <footer class="footer"><span class="footer-brand">✳ duelclub.</span><span>Made for hot takes, close calls, and group chats.</span><span>© 2026 Duel Club · Independent fan-inspired project</span></footer>
  </div>
  <div id="modal-root"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
